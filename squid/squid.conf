# Squid Proxy Configuration with Authentication
# Forward all traffic to Psiphon

# Port mà Squid lắng nghe
http_port 3128

# Cấu hình xác thực Basic Auth
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Squid Proxy Server - Authentication Required
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive off

# ACL định nghĩa
acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# Deny requests to unsafe ports
http_access deny !Safe_ports

# Deny CONNECT to other than secure SSL ports
http_access deny CONNECT !SSL_ports

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny manager

# Cho phép truy cập từ localhost
http_access allow localhost

# YÊU CẦU XÁC THỰC cho tất cả các requests khác
http_access allow authenticated

# Deny all other access to this proxy
http_access deny all

# Cấu hình chuyển tiếp tất cả traffic qua Psiphon
# Sử dụng hostname container, Docker DNS tự resolve
# no-digest: không dùng digest auth với parent proxy
cache_peer psiphon parent 8080 0 no-query no-digest default
never_direct allow all

# Disable caching để đảm bảo tất cả requests đi qua Psiphon
cache deny all

# Cache directory (required by Squid even if we don't cache)
cache_dir null /tmp

# Logging
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log none

# Leave coredumps in the first cache dir
coredump_dir /var/spool/squid

# Tăng timeout cho kết nối
connect_timeout 60 seconds
read_timeout 300 seconds
request_timeout 60 seconds

# DNS settings - Docker tự resolve hostname containers
# Force IPv4 first
dns_v4_first on

# Memory and cache settings
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 0 KB

# Forwarded headers
forwarded_for delete
via off
follow_x_forwarded_for deny all
